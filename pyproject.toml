[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-traffic-fingerprint"
version = "1.0.0"
description = "Reproducible metadata-only human-GenAI traffic classification"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<1.9", "matplotlib>=3.9,<4", "joblib>=1.4,<2"]

[project.scripts]
genai-fingerprint = "genai_fingerprint.cli:main"

[tool.setuptools.packages.find]
include = ["genai_fingerprint*"]
